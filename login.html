<html>
    <head>
        <title>Course Registration</title>
        <link rel="stylesheet" href="css style.css">
    </head>
    <body>
        <form>
            <p><b>PERSONAL</b></p>

            <label>Course :</label>
            <input type="text" class="course"><br>

            <label>Roll No : CB.SC.U4CSE25</label>
            <input type="text" maxlength="3" class="roll"><br>

            <label>Email :</label>
            <input type="email" class="email"><br>

            <p><b>COURSES</b></p>
            <input type="checkbox" id="cse">
            <label for="cse">23cse111</label><br>

            <input type="checkbox" id="aids">
            <label for="aids">23aids115</label><br>

            <input type="checkbox" id="ece">
            <label for="ece">23ece174</label><br>

            <input type="checkbox" id="eee">
            <label for="eee">23eee189</label><br>

            <p><b>TYPE</b></p>
            <input type="radio" name="type" id="reg">
            <label for="reg">Regular</label><br>

            <input type="radio" name="type" id="fast">
            <label for="fast">CSS</label><br>
            <input type="submit" value="submit">
        </form>
    </body>
</html>
