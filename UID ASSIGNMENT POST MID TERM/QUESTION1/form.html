<!DOCTYPE html>
<html>
<head>
    <title>Library Membership Form</title>
</head>

<body style="font-family: Arial; background-color: #e6e6e6;">

<div style="width:60%; margin:auto; padding:20px; background-color:#f2f2f2;;">

    <h2 style="text-align:center;">Library Membership Registration Form</h2>

    <form>

        <label style="display:inline-block; width:180px;">Full Name</label>
        <input type="text" style="width:60%; padding:6px;"><br><br>

        <label style="display:inline-block; width:180px;">Username</label>
        <input type="text" style="width:60%; padding:6px;"><br><br>

        <label style="display:inline-block; width:180px;">Email</label>
        <input type="email" style="width:60%; padding:6px;"><br><br>

        <label style="display:inline-block; width:180px;">Phone Number</label>
        <input type="text" style="width:60%; padding:6px;"><br><br>

        <label style="display:inline-block; width:180px;">Date of Birth</label>
        <input type="date" style="width:60%; padding:6px;"><br><br>

        <label style="display:inline-block; width:180px;">Gender</label>
        <span style="display:inline-block; width:60%;">
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
        </span><br><br>

        <label style="display:inline-block; width:180px;">Membership Type</label>
        <select style="width:60%; padding:6px;">
            <option>Select Membership</option>
            <option>Basic</option>
            <option>Premium</option>
        </select><br><br>

        <label style="display:inline-block; width:180px;">Department</label>
        <select style="width:60%; padding:6px;">
            <option>Select Department</option>
            <option>Science</option>
            <option>Arts</option>
            <option>Technology</option>
        </select><br><br>

        <label style="display:inline-block; width:180px;">Preferred Book Categories</label>
        <span style="display:inline-block; width:60%;">
            <input type="checkbox"> Science
            <input type="checkbox"> Literature
            <input type="checkbox"> Technology
            <input type="checkbox"> History
            <input type="checkbox"> Biography
        </span><br><br>

        <label style="display:inline-block; width:180px;">Membership Start Date</label>
        <input type="date" style="width:60%; padding:6px;"><br><br>

        <label style="display:inline-block; width:180px;">Address</label>
        <input type="text" style="width:60%; padding:6px;"><br><br>

        <div style="text-align:center; margin-top:20px;">
            <input type="submit" value="Submit"
                style="background-color:green; color:white; padding:10px 20px; border:none;">

            <input type="reset" value="Reset"
                style="background-color:red; color:white; padding:10px 20px; border:none;">
        </div>

    </form>

</div>

</body>
</html>
