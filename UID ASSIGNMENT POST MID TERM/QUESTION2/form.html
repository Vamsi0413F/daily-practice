<!DOCTYPE html>
<html>
<head>
<title>Bank Form</title>
</head>

<body style="font-family:Arial; background:#faf9f9;">



<h2 style="text-align:center; color:#0b3c6d;">ABC Bank Customer Registration Form</h2>

<form>

<table  cellspacing="10">

<tr>
<td>First Name</td>
<td>Last Name</td>
</tr>

<tr>
<td><input type="text" style="width: 500px;; padding:8px;"></td>
<td><input type="text" style="width: 500px;; padding:8px;"></td>
</tr>

<tr>
<td>Email</td>
<td>Phone Number</td>
</tr>

<tr>
<td><input type="email" style="width: 500px;; padding:8px;"></td>
<td><input type="text" style="width: 500px;; padding:8px;"></td>
</tr>

<tr>
<td>Date of Birth</td>
<td>Account Type</td>
</tr>

<tr>
<td><input type="date" style="width: 500px;; padding:8px;"></td>
<td>
<select style="width: 500px; padding:8px;">
<option>Savings</option>
<option>Current</option>
</select>
</td>
</tr>

<tr>
<td>Gender</td>
<td>Marital Status</td>
</tr>

<tr>
<td>
<input type="radio" name="g"> Male
<input type="radio" name="g"> Female
<input type="radio" name="g"> Other
</td>

<td>
<input type="radio" name="m"> Single
<input type="radio" name="m"> Married
</td>
</tr>

<tr>
<td>Banking Services Required</td>
<td>Initial Deposit</td>
</tr>

<tr>
<td>
<input type="checkbox"> ATM Card<br>
<input type="checkbox"> Internet Banking<br>
<input type="checkbox"> Mobile Banking<br>
<input type="checkbox"> SMS Alerts
</td>

<td>
<input type="text" style="width: 500px;; padding:8px;">
</td>
</tr>

<tr>
<td colspan="2">Address</td>
</tr>

<tr>
<td colspan="2">
<textarea style="width: 500px; height:80px;"></textarea>
</td>
</tr>

<tr>
<td colspan="2" style="text-align:center;">
<input type="submit" value="Submit"
style="background:green; color:white; padding:10px 20px; border:none; border-radius:5px;">

<input type="reset" value="Reset"
style="background:red; color:white; padding:10px 20px; border:none; border-radius:5px;">
</td>
</tr>

</table>

</form>


</body>
</html>
