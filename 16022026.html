<!--Q)design a form for creating a personal profile which consist of
    name, age, contact number, roll number as text boxes
    Address(limit=120char) and about yourself(limit=100 char) as text area
    Use radio button to select nationality as Indian or an NRI
    A dropdown button to select languages known
    Checkboxes to select hobbies
    Add 3 buttons submit reset and click
    Make the length of your phone number to 10 digits
    make a condition such that your number has to match the roll number
    with limiting the size -->
    <p style="text-align: center; font-size: xx-large;"><b>Personel Profile</b></p>
    <form>
        <label for="name">Enter name :</label>
        <input type="text" id="name" placeholder="Enter your name">
        <br>
        <label for="age">Enter age :</label>
        <input type="number" id="age" placeholder="Enter your age" value="15">
        <br>
        <label for="ph number">Enter phone number :</label>
        <input type="tel" id="ph number" placeholder="9XXXXXXXXX" minlength="10" maxlength="10">
        <br>
        <label for="roll number">Enter roll number :</label>
        <input type="text" id="roll number" placeholder="CB.SC.U4CSE253XX" minlength="16" maxlength="16">
    </form>
    </body>
</html>
