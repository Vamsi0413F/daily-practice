<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <label for="num1">Number 1:</label>
        <input type="text" id="num1" name="num1" placeholder="Enter first number" ><br><br>
        <label for="num2">Number 2:</label>
        <input type="text" id="num2" name="num2" placeholder="Enter second number" ><br><br>
        <button onclick="addNumbers()">Add</button>
        <button onclick="subtractNumbers()">Subtract</button>
        <button onclick="multiplyNumbers()">Multiply</button>
        <button onclick="divideNumbers()">Divide</button>
        var num1 = parseFloat(document.getElementById("num1").value);
        var num2 = parseFloat(document.getElementById("num2").value);

        <p id="result"></p>
        <script>
            function addNumbers(){
                let num1 = parseFloat(document.getElementById("num1").value);
                let num2 = parseFloat(document.getElementById("num2").value);
                let result = num1 + num2;
                document.getElementById("result").innerText = "Result: " + result;
            }
            function subtractNumbers(){
                let num1 = parseFloat(document.getElementById("num1").value);
                let num2 = parseFloat(document.getElementById("num2").value);
                let result = num1 - num2;
                document.getElementById("result").innerText = "Result: " + result;
            }
            function multiplyNumbers(){
                let num1 = parseFloat(document.getElementById("num1").value);
                let num2 = parseFloat(document.getElementById("num2").value);
                let result = num1 * num2;
                document.getElementById("result").innerText = "Result: " + result;
            }
            function divideNumbers(){
                let num1 = parseFloat(document.getElementById("num1").value);
                let num2 = parseFloat(document.getElementById("num2").value);
                if(num2 === 0){
                    document.getElementById("result").innerText = "Error: Division by zero is not allowed.";
                } else {
                    let result = num1 / num2;
                    document.getElementById("result").innerText = "Result: " + result;
                }
            }
        </script>
    </body>
</html>
