    <!DOCTYPE html>

    <head>
        <style>
            body { font-family: sans-serif; padding: 20px; }
            .header { color: #333; }
            .pink-line { border-top: 3px solid #e91e63; margin: 10px 0; }
            .shape-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
            /* Simple Square Shape */
            .square { width: 50px; height: 50px; background: blue; }
            /* Simple Triangle Shape */
            .triangle { width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 50px solid green; }
            /* Simple Circle Shape */
            .circle { width: 50px; height: 50px; background: red; border-radius: 50%; }
        </style>
    </head>
