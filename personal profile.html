<!DOCTYPE html>
<html>
<head>
    <title>Create Your Profile</title>
</head>

<body>

<center>
    <h1><font color="blue">Create Your Profile</font></h1>
    <h2>Fill out the details below to set up your profile.</h2>
</center>

<h3>Personal Information</h3>

<form>
<table cellpadding="6">
    <tr>
        <td>Full Name:</td>
        <td><input type="text" size="35"></td>
    </tr>

    <tr>
        <td>Email Address:</td>
        <td><input type="email" size="35"></td>
    </tr>

    <tr>
        <td>Password:</td>
        <td><input type="password" size="35"></td>
    </tr>

    <tr>
        <td>Confirm Password:</td>
        <td><input type="password" size="35"></td>
    </tr>
</table>

<hr width="500">

<h3>Interests</h3>
<input type="checkbox"> Hiking<br>
<input type="checkbox"> Photography<br>
<input type="checkbox"> Cooking<br>
<input type="checkbox"> Travel<br>

<hr width="500">

<h3>Gender</h3>
<input type="radio" name="gender"> Male<br>
<input type="radio" name="gender"> Female<br>
<input type="radio" name="gender"> Prefer not to say<br>

<hr width="500">

<h3>Country</h3>
<select>
    <option>Select your country</option>
    <option>India</option>
    <option>United States</option>
    <option>United Kingdom</option>
</select>
<br><br>


<br><br>

<!-- Blue button -->
<input type="submit" value="Create Profile"
       style="background-color:blue; color:white; padding:8px 20px; border:none;">

</form>

</body>
</html>
